name: Integration checks
on:
  push:
    paths: ['backend/**', 'frontend/**', 'run_*.py', 'Dockerfile', 'compose.yaml', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'run_*.py', 'Dockerfile', 'compose.yaml', '.github/workflows/backend-tests.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
        working-directory: backend
      - run: python -m pip check
        working-directory: backend
      - run: python -m ruff check . ../run_server.py ../run_demo.py
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ekt-qa .
      - name: One-origin container smoke
        run: |
          docker run -d --name ekt-qa -p 127.0.0.1:8000:8000 -e DEMO_CART_ENABLED=true -e DEMO_SEED_SYNTHETIC=true -e EKT_LIVE_ENABLED=false ekt-qa
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep 'chat-form'
          curl -fsS http://127.0.0.1:8000/api.js | grep 'fetch(path,'
          curl -fsS -X POST http://127.0.0.1:8000/api/chat/sessions
          curl -fsS http://127.0.0.1:8000/cart/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.env)" = 404
      - name: Container logs
        if: always()
        run: docker logs ekt-qa || true
